<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XH9FQG8X8F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-XH9FQG8X8F');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Human body, part by part · VRtor</title>
  <meta name="description" content="A life-size human body made of 3,245 real anatomical parts: bones, muscles, organs, vessels and nerves. Take any part out, alone or with everything it belongs to, in a VR headset's browser or any web browser." />
  <link rel="canonical" href="https://vrtor.io/bdy/" />
  <meta name="theme-color" content="#121012" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta property="og:title" content="Human body, part by part · VRtor" />
  <meta property="og:description" content="3,245 real anatomical parts at life size. Take out the heart, then one of its valves. In VR, right in your browser." />
  <meta property="og:image" content="https://vrtor.io/assets/cards/body.jpg" />
  <meta property="og:url" content="https://vrtor.io/bdy/" />
</head>
<body>
  <canvas id="scene" tabindex="0" aria-label="3D scene: a life-size human body made of separate bones, muscles, organs, vessels and nerves, standing on a plinth"></canvas>

  <header class="top">
    <a class="brand" href="/">VRtor<span>Body</span></a>
    <div class="search" role="search">
      <input type="search" placeholder="Search the body: femur, vagus, corazón…" aria-label="Search for a part of the body" aria-controls="search-results" aria-autocomplete="list" aria-expanded="false" autocomplete="off" disabled />
      <ul id="search-results" class="search-results" role="listbox" hidden></ul>
    </div>
  </header>

  <div class="loading" role="status">
    <p>Putting the body together…</p>
    <p class="loading-pct">0%</p>
    <button class="btn" type="button" data-retry hidden>Try again</button>
  </div>

  <section class="card" aria-live="polite" hidden>
    <button class="card-close" type="button" aria-label="Close card">×</button>
    <p class="card-kicker"></p>
    <h1 class="card-title"></h1>
    <p class="card-names" hidden></p>
    <p class="card-trail" hidden></p>
    <p class="card-body"></p>
    <p class="card-fact"></p>
    <p class="card-source" hidden></p>
    <div class="card-actions"></div>
  </section>

  <button class="vr-cta" type="button" data-enter-vr hidden>
    <svg viewBox="0 0 32 20" width="40" height="25" aria-hidden="true"><path fill="currentColor" d="M4 0h24a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4h-6.2a3 3 0 0 1-2.6-1.6l-1.5-2.7a2 2 0 0 0-3.4 0l-1.5 2.7A3 3 0 0 1 10.2 18H4a4 4 0 0 1-4-4V4a4 4 0 0 1 4-4Zm5 5.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm14 0a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>
    <span class="vr-cta-text"><strong>Enter VR</strong><small>Take it apart with your hands</small></span>
  </button>

  <label class="height" hidden>
    <span class="height-end" aria-hidden="true">Head</span>
    <input type="range" data-height step="0.01" value="1.05" aria-label="View height, from the feet to the head" />
    <span class="height-end" aria-hidden="true">Feet</span>
  </label>

  <nav class="bar" aria-label="Controls">
    <button class="btn" type="button" data-layer="skin" aria-pressed="false" disabled>Skin</button>
    <button class="btn" type="button" data-layer="muscles" aria-pressed="false" disabled>Muscles</button>
    <button class="btn" type="button" data-layer="organs" aria-pressed="false" disabled>Organs</button>
    <button class="btn" type="button" data-layer="skeleton" aria-pressed="false" disabled>Skeleton</button>
    <button class="btn" type="button" data-systems disabled>Systems</button>
    <button class="btn" type="button" data-back disabled>Put everything back</button>
    <div class="presence-controls"></div>
    <p class="hint" hidden>Click a part to choose it · drag the chosen part out · drag elsewhere to turn · right-drag or the slider to go up and down</p>
  </nav>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
