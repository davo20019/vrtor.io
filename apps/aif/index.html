<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XH9FQG8X8F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-XH9FQG8X8F');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI foundations · VRtor</title>
  <meta name="description" content="Learn how AI learns with your hands: sort fruit into data, turn a neuron's dials, roll its error downhill on a real 3D landscape and grow it into a network. In a VR headset's browser or any web browser." />
  <link rel="canonical" href="https://vrtor.io/aif/" />
  <meta name="theme-color" content="#10161c" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta property="og:title" content="AI foundations · VRtor" />
  <meta property="og:description" content="Teach a machine to sort fruit and watch it learn: data, a neuron, error, gradient descent and a network, all live and hands-on. In VR, right in your browser." />
  <meta property="og:url" content="https://vrtor.io/aif/" />
</head>
<body>
  <canvas id="scene" tabindex="0" aria-label="3D scene: a bright lab with a table of apples and oranges, a machine with two dials, a landscape on a round table and a large board on the wall"></canvas>

  <header class="top">
    <a class="brand" href="/">VRtor<span>AI foundations</span></a>
  </header>

  <div class="loading" role="status">
    <p>Setting up the lab…</p>
    <p class="loading-pct"></p>
    <button class="btn" type="button" data-retry hidden>Try again</button>
  </div>

  <section class="card" aria-live="polite" hidden>
    <button class="card-close" type="button" aria-label="Close card">×</button>
    <p class="card-kicker"></p>
    <h1 class="card-title"></h1>
    <p class="card-body"></p>
    <div class="card-dials" hidden>
      <label>Size dial <input type="range" min="-6" max="6" step="0.05" data-dial="0" /><output></output></label>
      <label>Colour dial <input type="range" min="-6" max="6" step="0.05" data-dial="1" /><output></output></label>
    </div>
    <div class="card-choices" hidden></div>
    <p class="card-fact"></p>
    <div class="card-actions"></div>
  </section>

  <button class="vr-cta" type="button" data-enter-vr hidden>
    <svg viewBox="0 0 32 20" width="40" height="25" aria-hidden="true"><path fill="currentColor" d="M4 0h24a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4h-6.2a3 3 0 0 1-2.6-1.6l-1.5-2.7a2 2 0 0 0-3.4 0l-1.5 2.7A3 3 0 0 1 10.2 18H4a4 4 0 0 1-4-4V4a4 4 0 0 1 4-4Zm5 5.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm14 0a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>
    <span class="vr-cta-text"><strong>Enter VR</strong><small>Learn it with your hands</small></span>
  </button>

  <nav class="bar" aria-label="Steps">
    <button class="btn" type="button" data-step="1" disabled>1 Data</button>
    <button class="btn" type="button" data-step="2" disabled>2 Neuron</button>
    <button class="btn" type="button" data-step="3" disabled>3 Error</button>
    <button class="btn" type="button" data-step="4" disabled>4 Learning</button>
    <button class="btn" type="button" data-step="5" disabled>5 Network</button>
    <button class="btn" type="button" data-menu disabled>Card</button>
    <div class="presence-controls"></div>
    <p class="hint" hidden>Drag to look around · scroll to zoom · click a fruit, a basket or the landscape</p>
  </nav>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
