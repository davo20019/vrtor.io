<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XH9FQG8X8F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-XH9FQG8X8F');

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Coronation of Napoleon, life size · VRtor</title>
  <meta name="description" content="Jacques-Louis David's Coronation of Napoleon at its real size, 9.79 by 6.21 m, in its frame on the red wall of the Louvre's Salle Daru. Walk up to it, meet the people in it, light it from the side and turn it round. In a VR headset's browser or any web browser." />
  <link rel="canonical" href="https://vrtor.io/sacre/" />
  <meta name="theme-color" content="#120d10" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta property="og:title" content="The Coronation of Napoleon, life size · VRtor" />
  <meta property="og:description" content="Stand in front of David's ten-metre Coronation of Napoleon as the Louvre hangs it, and meet the people in it. In VR, right in your browser." />
  <meta property="og:url" content="https://vrtor.io/sacre/" />
</head>
<body>
  <canvas id="scene" tabindex="0" aria-label="3D scene: the Coronation of Napoleon hanging on a red gallery wall"></canvas>

  <header class="top">
    <a class="brand" href="/">VRtor<span>Coronation of Napoleon</span></a>
    <p class="detail" hidden></p>
  </header>

  <div class="loading" role="status">
    <p>Hanging the painting…</p>
    <p class="loading-pct"></p>
    <button class="btn" type="button" data-retry hidden>Try again</button>
  </div>

  <section class="card" aria-live="polite" hidden>
    <button class="card-close" type="button" aria-label="Close card">×</button>
    <p class="card-kicker"></p>
    <h1 class="card-title"></h1>
    <p class="card-body"></p>
    <p class="card-fact"></p>
    <p class="card-source" hidden></p>
    <div class="card-actions"></div>
  </section>

  <button class="vr-cta" type="button" data-enter-vr hidden>
    <svg viewBox="0 0 32 20" width="40" height="25" aria-hidden="true"><path fill="currentColor" d="M4 0h24a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4h-6.2a3 3 0 0 1-2.6-1.6l-1.5-2.7a2 2 0 0 0-3.4 0l-1.5 2.7A3 3 0 0 1 10.2 18H4a4 4 0 0 1-4-4V4a4 4 0 0 1 4-4Zm5 5.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm14 0a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>
    <span class="vr-cta-text"><strong>Enter VR</strong><small>Stand in front of it</small></span>
  </button>

  <nav class="bar" aria-label="Controls">
    <button class="btn" type="button" data-tour disabled>The people in it</button>
    <button class="btn" type="button" data-light aria-pressed="false" disabled>Light from the side</button>
    <button class="btn" type="button" data-turn disabled>Turn it round</button>
    <button class="btn" type="button" data-frame disabled>Out of the frame</button>
    <p class="hint" hidden>Click any part to name it · drag to look round · scroll to get close · right-drag to move</p>
  </nav>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
