  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Apollo 11: Inside Columbia · vrtor</title>
  <meta name="description" content="Float beside the real Apollo 11 command module in lunar orbit, then climb inside: the Smithsonian's 3D scan of Columbia, at real size, in a VR headset's browser or any web browser." />
  <link rel="canonical" href="https://vrtor.io/apo/" />
  <meta name="theme-color" content="#0c0d12" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta property="og:title" content="Apollo 11: Inside Columbia · vrtor" />
  <meta property="og:description" content="The real Apollo 11 capsule, scanned by the Smithsonian, floating above the Moon. Sit in Michael Collins's seat. In VR, right in your browser." />
  <meta property="og:image" content="https://vrtor.io/assets/cards/apollo.jpg" />
  <meta property="og:url" content="https://vrtor.io/apo/" />

<body>
  <canvas id="scene" aria-label="3D scene: the Apollo 11 command module Columbia in orbit above the Moon"></canvas>

  <header class="top">
    <a class="brand" href="/">vrtor<span>Apollo 11</span></a>
  </header>

  <div class="loading" role="status">
    <p>Entering lunar orbit…</p>
    <p class="loading-pct">0%</p>
  </div>

  <section class="card" aria-live="polite" hidden>
    <button class="card-close" type="button" aria-label="Close card">×</button>
    <p class="card-kicker"></p>
    <h1 class="card-title"></h1>
    <p class="card-body"></p>
    <p class="card-fact"></p>
    <div class="card-actions"></div>
  </section>

  <button class="vr-cta" type="button" data-enter-vr hidden>
    <svg viewBox="0 0 32 20" width="40" height="25" aria-hidden="true"><path fill="currentColor" d="M4 0h24a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4h-6.2a3 3 0 0 1-2.6-1.6l-1.5-2.7a2 2 0 0 0-3.4 0l-1.5 2.7A3 3 0 0 1 10.2 18H4a4 4 0 0 1-4-4V4a4 4 0 0 1 4-4Zm5 5.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm14 0a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>
    <span class="vr-cta-text"><strong>Enter VR</strong><small>Float beside it above the Moon</small></span>
  </button>

  <nav class="bar" aria-label="Controls">
    <button class="btn" type="button" data-tour>Tour</button>
    <button class="btn" type="button" data-place>Go inside</button>
    <div class="presence-controls"></div>
    <p class="hint" hidden>Drag to look around · scroll to zoom · click a glowing marker</p>
  </nav>

  <script type="module" src="/src/main.js"></script>
