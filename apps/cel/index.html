<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XH9FQG8X8F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-XH9FQG8X8F');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The cell, part by part · VRtor</title>
  <meta name="description" content="Walk into an animal cell and a plant cell 150,000 times life size. Every organelle you learn about in school, to scale, labelled and explained, and every part comes out in your hands. In a VR headset's browser or any web browser." />
  <link rel="canonical" href="https://vrtor.io/cel/" />
  <meta name="theme-color" content="#0b1219" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta property="og:title" content="The cell, part by part · VRtor" />
  <meta property="og:description" content="An animal cell and a plant cell, 150,000 times life size. Walk in, take out a mitochondrion and look inside it. In VR, right in your browser." />
  <meta property="og:image" content="https://vrtor.io/assets/cards/cell.jpg" />
  <meta property="og:url" content="https://vrtor.io/cel/" />
</head>
<body>
  <canvas id="scene" tabindex="0" aria-label="3D scene: an animal cell and a plant cell, cut open, with their organelles inside"></canvas>

  <header class="top">
    <a class="brand" href="/">VRtor<span>Cell</span></a>
    <div class="search" role="search">
      <input type="search" placeholder="Search the cell: nucleus, chloroplast, ribosoma…" aria-label="Search for a part of the cell" aria-controls="search-results" aria-autocomplete="list" aria-expanded="false" autocomplete="off" disabled />
      <ul id="search-results" class="search-results" role="listbox" hidden></ul>
    </div>
  </header>

  <div class="loading" role="status">
    <p>Building the cells…</p>
    <p class="loading-pct"></p>
    <button class="btn" type="button" data-retry hidden>Try again</button>
  </div>

  <section class="card" aria-live="polite" hidden>
    <button class="card-close" type="button" aria-label="Close card">×</button>
    <p class="card-kicker"></p>
    <h1 class="card-title"></h1>
    <p class="card-names" hidden></p>
    <p class="card-trail" hidden></p>
    <p class="card-body"></p>
    <p class="card-fact"></p>
    <div class="card-actions"></div>
  </section>

  <button class="vr-cta" type="button" data-enter-vr hidden>
    <svg viewBox="0 0 32 20" width="40" height="25" aria-hidden="true"><path fill="currentColor" d="M4 0h24a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4h-6.2a3 3 0 0 1-2.6-1.6l-1.5-2.7a2 2 0 0 0-3.4 0l-1.5 2.7A3 3 0 0 1 10.2 18H4a4 4 0 0 1-4-4V4a4 4 0 0 1 4-4Zm5 5.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm14 0a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>
    <span class="vr-cta-text"><strong>Enter VR</strong><small>Walk into the cell</small></span>
  </button>

  <nav class="bar" aria-label="Controls">
    <button class="btn" type="button" data-view="animal" aria-pressed="false" disabled>Animal cell</button>
    <button class="btn" type="button" data-view="plant" aria-pressed="false" disabled>Plant cell</button>
    <button class="btn" type="button" data-view="both" aria-pressed="true" disabled>Both</button>
    <button class="btn" type="button" data-cut disabled>Close the cells</button>
    <button class="btn" type="button" data-labels aria-pressed="true" disabled>Labels</button>
    <button class="btn btn-learn" type="button" data-learn disabled>Learn</button>
    <button class="btn" type="button" data-back disabled>Put everything back</button>
    <div class="presence-controls"></div>
    <p class="hint" hidden>Click a part to choose it · drag the chosen part out · drag elsewhere to turn · scroll to zoom in</p>
  </nav>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
