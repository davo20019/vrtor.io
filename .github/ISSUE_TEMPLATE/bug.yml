name: Bug report
description: Something doesn't work or looks wrong
labels: [bug]
body:
  - type: input
    id: address
    attributes:
      label: Subject address
      placeholder: vrtor.io/mpc
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: Quest 3, Meta Quest Browser 40 / MacBook, Chrome 141 / iPhone, Safari
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Steps to reproduce help a lot. Screenshots or a short video too.
    validations:
      required: true
